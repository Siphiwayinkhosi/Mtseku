<script>
document.getElementById('copyBtn').addEventListener('click', async function() {
  const area = document.getElementById('signatureArea');
  const html = area.innerHTML;
  const text = area.innerText;
  try {
    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html], {type:'text/html'}),
        'text/plain': new Blob([text], {type:'text/plain'})
      })]);
    } else {
      const range = document.createRange();
      range.selectNodeContents(area);
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      document.execCommand('copy');
      selection.removeAllRanges();
    }
    document.getElementById('status').textContent = 'Signature copied. Paste it into Gmail, Outlook or Hostinger Webmail.';
  } catch (e) {
    document.getElementById('status').textContent = 'Copy failed. Select the signature manually and press Ctrl+C.';
  }
});
</script>
